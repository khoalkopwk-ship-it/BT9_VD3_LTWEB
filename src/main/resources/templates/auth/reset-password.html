<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <form th:action="@{/reset-password}"
              th:object="${resetPasswordDTO}"
              method="post">

            <h1>Đặt lại mật khẩu</h1>


            <div th:if="${success}"
                 class="alert success"
                 th:text="${success}">
            </div>


            <div th:if="${#fields.hasGlobalErrors()}"
                 class="alert error">

                <p th:each="e : ${#fields.globalErrors()}"
                   th:text="${e}">
                </p>

            </div>


            <label>Email</label>

            <input type="email"
                   th:field="*{email}"
                   required>


            <label>OTP</label>

            <input name="otp"
                   maxlength="6"
                   required>


            <label>Mật khẩu mới</label>

            <input type="password"
                   th:field="*{password}"
                   required>


            <label>Xác nhận mật khẩu</label>

            <input type="password"
                   th:field="*{confirmPassword}"
                   required>


            <button class="button full">
                Đổi mật khẩu
            </button>

        </form>

    </div>

</div>

</body>
</html>
