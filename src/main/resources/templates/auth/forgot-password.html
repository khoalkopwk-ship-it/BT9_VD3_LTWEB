<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <form th:action="@{/forgot-password}"
              th:object="${forgotPasswordDTO}"
              method="post">

            <h1>Quên mật khẩu</h1>

            <div th:if="${#fields.hasGlobalErrors()}"
                 class="alert error">

                <p th:each="e : ${#fields.globalErrors()}"
                   th:text="${e}">
                </p>

            </div>


            <label>Email</label>

            <input type="email"
                   th:field="*{email}"
                   required>


            <button class="button full">
                Gửi OTP
            </button>

        </form>


        <p>
            <a th:href="@{/login}">
                Quay lại Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
